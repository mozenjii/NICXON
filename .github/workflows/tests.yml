name: tests

on:
  push:
    branches: [main, "**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      # The suite passing is not by itself evidence the rules are protected. The
      # mutation score is, so it is a build gate rather than a report nobody reads.
      - name: Validate the golden corpus
        run: ruleweaver validate examples/snap/rules.json

      - name: Check the fixture still evaluates
        run: ruleweaver evaluate examples/snap/rules.json examples/snap/scenarios/baseline.json
