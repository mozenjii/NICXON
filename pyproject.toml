[project]
name = "ruleweaver"
version = "0.1.0"
description = "A compiler for turning natural-language rules and regulations into provenance-preserving, testable, executable rule representations."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Mozenjii", email = "mhbamdm@gmail.com" }]
readme = "README.md"

# Pydantic carries the IR schema: validation, typed parsing and JSON Schema
# export all come from one dependency, and docs/13_REPO_STRUCTURE.md requires
# the IR package to stay free of model-provider and target-runtime imports.
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Model providers are optional extras. The core compiler, evaluator and validators
# never import them, so a deployment that only executes approved rules installs
# neither SDK — which is ADR-003 enforced by packaging rather than by convention.
anthropic = ["anthropic>=0.69"]
openai = ["openai>=1.60"]
# The review application. SQLAlchemy so the audit log runs on SQLite in development and
# PostgreSQL in deployment without a rewrite; FastAPI + Jinja so the whole reviewer
# surface is one Python process and one container, with no JavaScript build step.
review = [
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn>=0.32",
    "python-multipart>=0.0.9",
]

[project.scripts]
ruleweaver = "ruleweaver.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ruleweaver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Static analysis. Configured so that /health measures more than one dimension: with only
# a test runner wired up, a composite score reports that one tool passed, not that the
# codebase is healthy.
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
    # Long lines are re-wrapped by hand where it helps; a hard failure on a citation or a
    # regulation quote that cannot be split would push those out of the code entirely.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately import inside functions to keep optional extras optional, and assert
# on private structure the public API does not expose.
"tests/*" = ["B011", "SIM117"]

[tool.mypy]
python_version = "3.11"
files = ["src/ruleweaver"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# Not strict yet. Turning on disallow_untyped_defs today produces hundreds of findings in
# code that is already covered by tests, which trains everyone to ignore the tool. The
# ratchet is: keep this green, then raise it one flag at a time.
check_untyped_defs = true
